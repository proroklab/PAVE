[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "critic-sharing"
version = "0.1.0"
description = "Research code for critic-sharing reinforcement learning experiments."
requires-python = ">=3.13,<3.14"
dependencies = [
  "gymnasium>=1.2",
  "matplotlib>=3.8",
  "numpy>=2.0",
  "omegaconf>=2.3",
  "opencv-python>=4.8",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "scipy>=1.11",
  "seaborn>=0.13",
  "stable-baselines3>=2.8",
  "torch>=2.11",
  "tqdm>=4.66",
  "typer>=0.12",
  "wandb>=0.16",
]

[dependency-groups]
dev = [
  "mypy",
  "pre-commit",
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
critic-sharing = "critic_sharing.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["critic_sharing*"]
namespaces = true

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
