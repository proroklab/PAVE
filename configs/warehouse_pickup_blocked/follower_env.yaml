# Follower env config for the warehouse_pickup_blocked scenario.
#
# Geometry is identical to vanilla warehouse — same gaps, same shelves,
# same world bounds. The only delta is mechanical:
#   * pickup_disabled_gap_indices: [1] — the middle gap (x=0). The
#     follower's auto-pickup branch silently refuses when the object
#     lies in this gap's x-band.
#
# At training time (this file is what train_follower reads), the env
# also filters object spawns to gaps {0, 2} so the follower never sees
# pickups at the disabled gap. V_F therefore overestimates gap-1's
# value at deployment because it's distance-shaped (gap-1 is central,
# close to the middle shelf) but never trained on the actual outcome.
#
# At deployment, the leader can still drop at gap-1 (leader env is
# unchanged); the object lands there and the follower walks toward it,
# fails to pick up, and ultimately times out. The OOD trust factor's
# job is to silence V_F's overestimate so the planner doesn't actively
# steer the leader toward the doomed gap.
dt: 0.1
max_steps: 300
max_speed: 2.5
max_yaw_rate: 3.141592653589793

world_min: -5.0
world_max: 5.0

agent_side: 0.6
object_radius: 0.2

wall_y: 0.0
gap_xs: [-3.3333333333333335, 0.0, 3.3333333333333335]
gap_width: 0.55

shelf_xs: [-2.0, 0.0, 2.0]
shelf_width: 0.8
shelf_y_min: 0.8
shelf_y_max: 4.5

pickup_cone_half_angle: 1.0471975511965976
pickup_max_distance: 0.9
drop_distance: 0.55
interact_threshold: 0.5

step_penalty: 0.01
step_penalty_carrying: 0.1
pickup_reward: 4.0
goal_reward: 25.0
bad_drop_penalty: 5.0
progress_weight: 1.0

goal_tolerance: 0.3
collision_penalty: 0.1
spawn_near_goal: false

# gap_idx 1 = middle gap (x=0). Follower's auto-pickup is disabled
# when the object lies inside this gap's x-band. Used at BOTH training
# and deployment for this scenario.
pickup_disabled_gap_indices: [1]
