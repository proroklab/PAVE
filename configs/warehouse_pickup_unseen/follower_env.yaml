# Follower env config for the warehouse_pickup_unseen scenario.
#
# Same trained follower + VAE as warehouse_pickup_blocked (see TASK
# map in cli/_common.py), but DEPLOYMENT leaves the pickup mechanic
# enabled at the disabled gap. The follower never trained on
# pickup-at-gap-1 outcomes (because train_follower.yaml's
# env_overrides sets pickup_disabled_gap_indices=[1]), so V_F's
# prediction there is uncalibrated; whether the actual pickup
# succeeds depends on the policy's zero-shot generalization.
#
# Geometry and reward shaping match vanilla warehouse exactly. The
# only relevant difference vs vanilla is that the follower-policy
# checkpoint loaded here is the warehouse_pickup_blocked one (trained
# never having seen pickups at gap-1).
dt: 0.1
max_steps: 300
max_speed: 2.5
max_yaw_rate: 3.141592653589793

world_min: -5.0
world_max: 5.0

agent_side: 0.6
object_radius: 0.2

wall_y: 0.0
gap_xs: [-3.3333333333333335, 0.0, 3.3333333333333335]
gap_width: 0.55

shelf_xs: [-2.0, 0.0, 2.0]
shelf_width: 0.8
shelf_y_min: 0.8
shelf_y_max: 4.5

pickup_cone_half_angle: 1.0471975511965976
pickup_max_distance: 0.9
drop_distance: 0.55
interact_threshold: 0.5

step_penalty: 0.01
step_penalty_carrying: 0.1
pickup_reward: 4.0
goal_reward: 25.0
bad_drop_penalty: 5.0
progress_weight: 1.0

goal_tolerance: 0.3
collision_penalty: 0.1
spawn_near_goal: false

# Pickup is ENABLED at deployment (empty list) — but during training
# the follower never saw pickups at gap-1 because of the
# train_follower.yaml::env_overrides override (pickup_disabled_gap_indices=[1]
# is set at training time only).
pickup_disabled_gap_indices: []
