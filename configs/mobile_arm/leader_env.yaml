# Leader env config for the mobile_arm scenario.
world_min: -5.0
world_max: 5.0
dt: 0.1
max_steps: 300

# Base
base_size: 0.6
base_height: 0.4

# Arm geometry (4-DOF planar; kept on leader config for symmetry).
# Sign convention: positive joints = bend forward/down. Cumulative angles
# from horizontal compound subtractively (φ_L2a = θ_2 − θ_3, etc.).
L1: 0.5
L2a: 0.6
L2b: 0.6
theta1_low: -3.141592653589793
theta1_high: 3.141592653589793
theta2_low: 0.0
theta2_high: 1.5707963267948966
theta3_low: 0.0
theta3_high: 3.141592653589793
theta4_low: 0.0
theta4_high: 3.141592653589793
theta1_default: 0.0                    # 0 — arm forward, pointing at the tray
theta2_default: 1.5707963267948966     # π/2 — upper arm vertical
theta3_default: 0.7853981633974483     # π/4 — elbow bent forward 45°
theta4_default: 0.7853981633974483     # π/4 — wrist bent forward 45°

# Tray (in base frame, z above chassis top)
tray_offset_x: 0.25
tray_offset_y: 0.0
tray_offset_z: 0.05

# Object
object_radius: 0.05

# Leader dynamics + reward
max_speed: 1.5
max_yaw_rate: 3.141592653589793
interact_threshold: 0.5
desired_distance: 1.0
gaussian_sigma: 0.3
leader_object_min_separation: 1.5
step_penalty: 0.01
progress_weight: 1.0
pickup_reward: 1.0       # unused on leader, kept for schema
goal_reward: 25.0

# Pickup epsilons (unused on leader)
eps_pickup: 0.1
eps_tray: 0.1
